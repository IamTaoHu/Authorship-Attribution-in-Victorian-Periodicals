# Full DeBERTa fine-tuning was unstable on RTX 3050 4GB in this environment. Prefer LoRA configs under configs/phase3/lora/.
experiment_name: deberta_v3_base_full_ft_disabled
enabled: false
notes: "Disabled after NaN loss / grad_norm instability on RTX 3050 4GB. Use LoRA ablation instead."
model_name: microsoft/deberta-v3-base
dataset_name: celvaigh/periad
text_column: text
label_column: author
output_dir: outputs/phase3
phase1_dataset_path: outputs/phase1/periad_cleaned
batch_size: 1
eval_batch_size: 2
learning_rate: 5.0e-6
epochs: 1
max_length: 512
weight_decay: 0.01
max_grad_norm: 0.5
warmup_ratio: 0.2
seed: 42
gradient_accumulation_steps: 16
fp16: false
bf16: false
use_safetensors: true
low_cpu_mem_usage: true
torch_dtype: null
save_total_limit: 2
eval_strategy: epoch
save_strategy: epoch
logging_steps: 50
use_lora: false
save_embeddings: true
save_logits: true
save_predictions: true
