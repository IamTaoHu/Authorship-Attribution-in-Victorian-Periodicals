experiment_name: deberta_base_lora_r16
model_name: microsoft/deberta-base
dataset_name: celvaigh/periad
text_column: text
label_column: author
output_dir: outputs/phase3
phase1_dataset_path: outputs/phase1/periad_cleaned
batch_size: 2
eval_batch_size: 4
learning_rate: 1.0e-4
epochs: 5
max_length: 512
weight_decay: 0.01
max_grad_norm: 0.5
warmup_ratio: 0.1
seed: 42
gradient_accumulation_steps: 8
fp16: false
bf16: false
use_safetensors: true
low_cpu_mem_usage: true
torch_dtype: null
save_total_limit: 2
eval_strategy: epoch
save_strategy: epoch
logging_steps: 50
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - in_proj
modules_to_save:
  - classifier
  - pooler
save_embeddings: true
save_logits: true
save_predictions: true
