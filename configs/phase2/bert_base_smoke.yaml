phase: phase2
experiment_name: bert_base_smoke
model_name: bert-base-uncased

max_length: 512
batch_size: 8
learning_rate: 2.0e-5
epochs: 1
weight_decay: 0.01
seed: 42
gradient_accumulation_steps: 1
eval_strategy: epoch
save_strategy: epoch
metric_for_best_model: macro_f1
save_total_limit: 2
load_best_model_at_end: true
logging_steps: 50
fp16: true
max_train_samples: 64
max_eval_samples: 32

paths:
  dataset:
    manager: dataset_dir
    parts: [processed, periad]
  run_artifacts:
    manager: phase_artifact_dir
    phase: phase2
    parts: [runs, bert_base_smoke]
  tables:
    manager: phase_artifact_dir
    phase: phase2
    parts: [tables]
  reports:
    manager: phase_artifact_dir
    phase: phase2
    parts: [reports]
  plots:
    manager: phase_artifact_dir
    phase: phase2
    parts: [plots]
  checkpoint:
    manager: checkpoint_dir
    parts: [phase2, bert_base_smoke]
