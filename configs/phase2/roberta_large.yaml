phase: phase2
experiment_name: roberta_large
model_name: roberta-large

max_length: 512
batch_size: 4
learning_rate: 2.0e-5
epochs: 3
weight_decay: 0.01
seed: 42
gradient_accumulation_steps: 2
eval_strategy: epoch
save_strategy: epoch
metric_for_best_model: macro_f1
save_total_limit: 2
load_best_model_at_end: true
logging_steps: 50
fp16: true

paths:
  dataset:
    manager: dataset_dir
    parts: [processed, periad]
  run_artifacts:
    manager: phase_artifact_dir
    phase: phase2
    parts: [runs, roberta_large]
  tables:
    manager: phase_artifact_dir
    phase: phase2
    parts: [tables]
  reports:
    manager: phase_artifact_dir
    phase: phase2
    parts: [reports]
  plots:
    manager: phase_artifact_dir
    phase: phase2
    parts: [plots]
  checkpoint:
    manager: checkpoint_dir
    parts: [phase2, roberta_large]
