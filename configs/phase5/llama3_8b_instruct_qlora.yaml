phase: phase5
run_name: llama3_qlora
model_name: meta-llama/Meta-Llama-3-8B-Instruct
mode: full
final_benchmark: true
local_diagnostic: false

dataset:
  processed_dir: datasets/processed/periad
  train_split: train
  eval_split: test
  max_train_samples:
  max_eval_samples:

prompt:
  max_length: 1024
  max_new_tokens: 16
  max_input_chars: 6000
  system_message: "You are an authorship attribution classifier. Answer with exactly one author name and no explanation."

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  allow_diagnostic_fallback_without_4bit: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  bias: none
  task_type: CAUSAL_LM

training:
  seed: 42
  max_steps: -1
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 250
  save_total_limit: 2
  fp16: false
  bf16: true
  optim: paged_adamw_8bit
  report_to: []

generation:
  do_sample: false
  temperature: 0.0

paths:
  run_dir: outputs/phase5/runs/llama3_qlora
  checkpoint_dir: checkpoints/phase5/llama3_qlora
